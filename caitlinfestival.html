<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111320" />
  <meta name="description" content="@caitlinxandrea festival social links" />
  <title>@caitlinxandrea | Festival Links</title>

  <style>
    :root {
      --text: #fff;
      --muted: rgba(255,255,255,.78);
      --glass: rgba(11,13,27,.56);
      --border: rgba(255,255,255,.20);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: #111320;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
    }

    .bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        linear-gradient(to bottom, rgba(7,8,18,.08), rgba(7,8,18,.32) 48%, rgba(7,8,18,.84)),
        url("festival-photo.jpg") center 36% / cover no-repeat;
      transform: scale(1.015);
    }

    .wrap {
      width: min(92vw, 430px);
      min-height: 100svh;
      display: flex;
      align-items: flex-end;
      padding: 28px 0 max(28px, env(safe-area-inset-bottom));
    }

    .card {
      width: 100%;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--glass);
      box-shadow: 0 24px 70px rgba(0,0,0,.36);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .tag {
      display: inline-block;
      padding: 8px 11px;
      border-radius: 999px;
      background: rgba(255,255,255,.11);
      border: 1px solid rgba(255,255,255,.16);
      font-size: .76rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 15px 0 5px;
      font-size: clamp(2rem, 8vw, 3rem);
      line-height: 1;
      letter-spacing: -.05em;
    }

    .handle {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
      font-weight: 700;
    }

    .sub {
      margin: 12px 0 22px;
      color: var(--muted);
      line-height: 1.5;
      font-size: .95rem;
    }

    .links {
      display: grid;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 15px 16px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.12);
      color: #fff;
      text-decoration: none;
      font-weight: 850;
      transition: transform .18s ease, background .18s ease;
    }

    .btn:hover,
    .btn:focus-visible {
      transform: translateY(-2px);
      background: rgba(255,255,255,.20);
      outline: none;
    }

    .left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.14);
      font-size: 1.3rem;
    }

    .label {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .label small {
      color: rgba(255,255,255,.66);
      font-size: .74rem;
      font-weight: 650;
    }

    .foot {
      text-align: center;
      color: rgba(255,255,255,.52);
      font-size: .74rem;
      margin: 16px 0 0;
    }

    @media (min-width: 700px) {
      .wrap { align-items: center; }
    }
  </style>
</head>

<body>
  <div class="bg"></div>

  <main class="wrap">
    <section class="card">
      <div class="tag">✦ Festival Mode</div>

      <h1>Come say hi ✌️</h1>
      <p class="handle">@caitlinxandrea</p>
      <p class="sub">Tap a link below and add me. See you in the crowd 🪩✨</p>

      <div class="links">
        <a class="btn"
           href="https://www.instagram.com/caitlinxandrea/"
           target="_blank"
           rel="noopener noreferrer">
          <span class="left">
            <span class="icon">◎</span>
            <span class="label">
              <span>Instagram</span>
              <small>@caitlinxandrea</small>
            </span>
          </span>
          <span>↗</span>
        </a>

        <a class="btn"
           href="https://www.snapchat.com/add/caitlinxandrea"
           target="_blank"
           rel="noopener noreferrer">
          <span class="left">
            <span class="icon">👻</span>
            <span class="label">
              <span>Snapchat</span>
              <small>@caitlinxandrea</small>
            </span>
          </span>
          <span>↗</span>
        </a>
      </div>

      <p class="foot">NFC tap → socials</p>
    </section>
  </main>
</body>
</html>
