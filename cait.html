<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caitlin</title>
<style>
  :root{
    --ink:#181022;
    --paper:#f5f0f6;
    --purple:#8b3ff2;
    --magenta:#ff3d9a;
    --red:#ff4d5e;
    --teal:#2fd6c8;
    --gold:#ffcb3f;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background:var(--ink);
    font-family:'Space Grotesk', 'Helvetica Neue', Arial, sans-serif;
    color:var(--paper);
    overflow-x:hidden;
  }

  body{
    position:relative;
    display:flex;
    justify-content:center;
    padding:0 0 60px;
  }

  .glow-strip{
    position:fixed;
    inset:0;
    background:linear-gradient(115deg,
      var(--purple) 0%, var(--magenta) 30%, var(--red) 55%,
      var(--teal) 80%, var(--purple) 100%);
    background-size:400% 400%;
    opacity:0.18;
    animation:drift 18s ease-in-out infinite;
    z-index:0;
  }

  @keyframes drift{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }

  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:420px;
    padding:28px 22px 0;
  }

  .frame{
    position:relative;
    border-radius:28px;
    padding:6px;
    background:linear-gradient(135deg,var(--purple),var(--red),var(--teal));
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.65);
  }

  .photo-wrap{
    border-radius:24px;
    overflow:hidden;
    background:#111;
    aspect-ratio:3/4;
  }

  .photo-wrap img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .fringe{
    height:16px;
    width:100%;
    background-image: repeating-linear-gradient(
      90deg,
      var(--purple) 0 8px,
      var(--magenta) 8px 16px,
      var(--red) 16px 24px,
      var(--teal) 24px 32px
    );
    clip-path: polygon(
      0% 0%, 100% 0%, 100% 40%,
      95% 100%, 90% 40%, 85% 100%, 80% 40%,
      75% 100%, 70% 40%, 65% 100%, 60% 40%,
      55% 100%, 50% 40%, 45% 100%, 40% 40%,
      35% 100%, 30% 40%, 25% 100%, 20% 40%,
      15% 100%, 10% 40%, 5% 100%, 0% 40%
    );
    margin-top:-2px;
    position:relative;
    z-index:2;
    opacity:0.9;
  }

  .name-block{
    text-align:center;
    margin-top:30px;
  }

  .name-block h1{
    font-size:2.1rem;
    line-height:1.05;
    margin:0;
    font-weight:700;
    letter-spacing:-0.02em;
  }

  .links{
    margin-top:34px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .link-btn{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    text-decoration:none;
    color:var(--ink);
    padding:16px 20px;
    border-radius:18px;
    font-weight:700;
    font-size:1.05rem;
    background:var(--paper);
    border:3px solid var(--ink);
    box-shadow:6px 6px 0 var(--purple);
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }

  .link-btn:active{
    transform:translate(4px,4px);
    box-shadow:2px 2px 0 var(--purple);
  }

  .link-btn .icon{
    width:38px;
    height:38px;
    flex:none;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .link-btn .icon svg{
    width:22px;
    height:22px;
  }

  .link-btn .label{
    display:flex;
    flex-direction:column;
    line-height:1.2;
  }

  .link-btn .label small{
    font-weight:500;
    font-size:0.75rem;
    opacity:0.6;
  }

  .snap .icon{background:var(--gold);}
  .insta .icon{background:linear-gradient(135deg,var(--magenta),var(--purple));}
  .insta .icon svg{fill:white;}
  .snap .icon svg{fill:var(--ink);}

  footer{
    text-align:center;
    margin-top:38px;
    font-size:0.75rem;
    opacity:0.4;
    letter-spacing:0.02em;
  }

  @media (prefers-reduced-motion: reduce){
    .glow-strip{animation:none;}
  }
</style>
</head>
